<title>D3-One · PMU-B</title>

<style>
:root{
  --bg:#f4f5f9; --panel:#fff; --ink:#18213a; --ink2:#3a4560; --muted:#6c7590; --line:#e2e6ef;
  --side:#141c3a; --accent:#3156d3; --conf:#d43d36;
  --sans:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --latin:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
html[lang="en"] body{font-family:var(--latin),var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.lang{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:2px;background:rgba(255,255,255,.06)}
.lang button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font:600 12.5px var(--latin);color:rgba(255,255,255,.6)}
.lang button.on{background:#fff;color:var(--side)}
.lang.lt{border-color:var(--line);background:var(--panel)}
.lang.lt button{color:var(--muted)}
.lang.lt button.on{background:var(--side);color:#fff}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1000px 520px at 15% -10%,#2c3f86 0,transparent 60%),var(--side)}
.lcard{position:relative;width:100%;max-width:400px;background:var(--panel);border-radius:18px;padding:36px 30px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.lcard .lang{position:absolute;top:14px;right:14px}
.mark{width:66px;height:66px;border-radius:18px;background:var(--side);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font:700 19px var(--latin);letter-spacing:-.02em;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.mark span{color:#7f9cff}
.plogo{width:150px;height:84px;margin:0 auto 12px;display:grid;place-items:center}
.plogo img{max-width:100%;max-height:100%;object-fit:contain}
.plogo:empty{width:66px;height:66px;border-radius:18px;background:var(--side)}
.lcard h1{font:700 22px var(--latin);margin:0 0 2px;letter-spacing:-.01em}
.lcard p{margin:0 0 22px;color:var(--muted);font-size:13px}
.lcard input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f8f9fc;text-align:center;letter-spacing:.08em;font-size:16px}
.lcard input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.err{color:var(--conf);font-size:13px;min-height:20px;margin-top:6px}
.pri{width:100%;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:11px;font-weight:600}
.pri:hover{filter:brightness(1.08)}
.pri:disabled{opacity:.6}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6}
.apps-mini{display:flex;justify-content:center;gap:8px;margin-top:18px}
.apps-mini span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}

/* home */
.hero{background:radial-gradient(900px 420px at 10% -20%,#2c3f86 0,transparent 60%),var(--side);color:#fff;padding:0 0 92px}
.top{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:16px 24px}
.top .mark{width:40px;height:40px;border-radius:11px;font-size:13px;margin:0;background:rgba(255,255,255,.1)}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 16px var(--latin)}
.brand span{display:block;font-size:12px;color:#9aa4c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12.5px;color:#c3cae0;display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.06);white-space:nowrap}
.who i{width:8px;height:8px;border-radius:50%;background:#4cd18a}
.who.view i{background:#f5c13d}
.out{border:1px solid rgba(255,255,255,.18);background:transparent;color:#c3cae0;border-radius:9px;padding:6px 11px;display:inline-flex;gap:7px;align-items:center;font-size:13px;white-space:nowrap}
.out:hover{color:#fff;border-color:#ff9a94}
.out svg.i{width:16px;height:16px}
.greet{max-width:1120px;margin:0 auto;padding:30px 24px 0}
.greet small{font:600 12px var(--latin);letter-spacing:.12em;text-transform:uppercase;color:#7f9cff}
.greet h1{margin:6px 0 6px;font-size:30px;line-height:1.25;letter-spacing:-.01em}
.greet p{margin:0;color:#aab3cf;max-width:60ch}
.greet .asg{margin-top:10px;display:inline-flex;gap:8px;align-items:center;font-size:13px;color:#dfe5ff;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:999px}
.greet .asg:empty{display:none}

main{max-width:1120px;margin:-64px auto 0;padding:0 24px 60px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.app{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,60,.05),0 10px 30px rgba(20,30,60,.08);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s;overflow:hidden}
.app::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
a.app:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,60,.06),0 18px 40px rgba(20,30,60,.12)}
.app .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--cb);color:var(--c)}
.app .ic svg.i{width:24px;height:24px}
.app h2{margin:0;font-size:18px;line-height:1.3}
.app h2 small{display:block;font:500 12.5px var(--latin);color:var(--muted);margin-top:2px}
.app p{margin:0;color:var(--ink2);font-size:13.5px;flex:1}
.app .peek{font-size:12.5px;color:var(--ink2);background:#f6f7fb;border-radius:10px;padding:9px 11px;line-height:1.45}
.app .peek b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:1px}
.app .go{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;margin-top:2px;font-weight:600;color:var(--c)}
.app .go span.k{font-size:12px;color:var(--muted);font-weight:500}
.app.locked>*{opacity:.5}
.app.locked::before{opacity:.4}
.app.locked .go{color:var(--muted)}
.foot{margin-top:26px;color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .top{padding:12px 14px}
  .brand span,.who .tx,.out .tx{display:none}
  .greet{padding:22px 16px 0}.greet h1{font-size:23px}
  main{padding:0 14px 40px}
}
</style>
</head>
<body>

<section id="login">
  <div class="lcard">
    <div class="lang" data-lang><button data-l="th">TH</button><button data-l="en">EN</button></div>
    <div class="plogo logoSlot"></div>
    <h1>D3<span style="color:#3156d3">-</span>One</h1>
    <p data-i="loginSub"></p>
    <input id="code" type="password" data-ip="codePh" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="pri" id="go" data-i="signIn"></button>
    <div class="note" data-i="loginNote"></div>
    <div class="apps-mini" id="mini"></div>
  </div>
</section>

<div id="home" class="hidden">
  <div class="hero">
    <div class="top">
      <div class="mark">D3</div>
      <div class="brand"><b>D3-One</b><span data-i="brandSub"></span></div>
      <div class="lang" data-lang><button data-l="th">TH</button><button data-l="en">EN</button></div>
      <div class="who" id="who"><i></i><span class="tx" id="whoTx"></span></div>
      <button class="out" id="out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="tx" data-i="signOut"></span></button>
    </div>
    <div class="greet">
      <small>D3 · PMU-B</small>
      <h1 id="hello"></h1>
      <p data-i="heroSub"></p>
      <p class="asg" id="asGroup"></p>
    </div>
  </div>
  <main>
    <div class="grid" id="grid"></div>
    <div class="foot"><span id="ver"></span><span data-i="footNote"></span></div>
  </main>
</div>

var LANG='th';
function t(k){var v=I[k];return v?v[LANG==='en'?1:0]:k}
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function del(k){try{localStorage.removeItem(k)}catch(e){}}

/* ---------- shared session ---------- */
function auth(){try{var s=JSON.parse(get('d3one:auth')||'null');return s&&s.exp>Date.now()&&Array.isArray(s.apps)?s:null}catch(e){return null}}
function setLang(l){
  LANG=l==='en'?'en':'th'; put('d3one:lang',LANG);
  put('peb_lang',LANG); put('dap.lang',JSON.stringify(LANG));   // ส่งภาษาต่อให้ระบบอื่น
  document.documentElement.lang=LANG;
  $$('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});
  $$('[data-ip]').forEach(function(e){e.placeholder=t(e.dataset.ip)});
  $$('[data-lang] button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG)});
  if(auth()) renderHome();
}
function signOut(){
  del('d3one:auth'); del('d3one:tok');
  // ปิด session ของระบบที่เปิดผ่าน D3-One ด้วย
  if(get('peb_sso')==='1'){del('peb_sso');del('peb_auth')}
  if(get('dap.sso')){del('dap.sso');del('dap.session');try{var c=JSON.parse(get('dap.cfg')||'{}');if(c.tokenFromLock){delete c.token;delete c.tokenFromLock;put('dap.cfg',JSON.stringify(c))}}catch(e){}}
  location.reload();
}

/* ---------- editor code → token ---------- */
function hexB(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function catB(a,b){var r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r}
function sha(b){return crypto.subtle.digest('SHA-256',b).then(function(x){return new Uint8Array(x)})}
async function unlockToken(code,lock){
  if(!lock||!lock.c||!window.crypto||!crypto.subtle) return null;
  var cb=new TextEncoder().encode(code), k=await sha(catB(hexB(lock.s),cb));
  for(var i=0;i<5000;i++) k=await sha(catB(k,cb));
  var ct=hexB(lock.c), out=new Uint8Array(ct.length), blk=0;
  for(var o=0;o<ct.length;o+=32){var st=await sha(catB(k,new Uint8Array([0,0,(blk>>8)&255,blk&255])));blk++;for(var j=0;j<32&&o+j<ct.length;j++)out[o+j]=ct[o+j]^st[j]}
  var x=new TextDecoder().decode(out);
  return /^(ghp_|github_pat_)[A-Za-z0-9_]+$/.test(x)?x:null;
}
async function login(){
  var c=$('#code').value.trim().toLowerCase(); if(!c) return;
  $('#err').textContent='';
  var exp=Date.now()+SESSION_HOURS*3600e3;
  var b=$('#go'); b.disabled=true; b.textContent=t('checking');
  var tk=null, grp=null;
  for(var i=0;i<GROUPS.length;i++){ try{tk=await unlockToken(c,LOCKS[GROUPS[i].id])}catch(e){tk=null} if(tk){grp=GROUPS[i];break} }
  b.disabled=false; b.textContent=t('signIn');
  if(!tk){$('#err').textContent=t('wrong');$('#code').select();return}
  put('d3one:tok',tk); put('d3one:auth',JSON.stringify({exp:exp,role:'edit',group:grp.id,groupName:grp.name,apps:grp.apps,at:Date.now()}));
  showHome();
}

/* ---------- home ---------- */
function canOpen(a,s){return (s.apps||[]).indexOf(a.id)>-1}
function directorPeek(){
  try{
    var d=JSON.parse(get('dap.data')||'null'); if(!d||!d.items) return '';
    var x=new Date(), today=new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())).toISOString().slice(0,10);
    var up=d.items.filter(function(i){return !i.deleted&&i.status!=='cancelled'&&i.end>=today}).sort(function(a,b){return a.start<b.start?-1:1});
    if(!up.length) return '';
    var i=up[0], TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'], EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function f(s){var p=s.split('-');return (+p[2])+' '+(LANG==='en'?EN:TH)[+p[1]-1]}
    return '<div class="peek"><b>'+t('nextUp')+'</b>'+esc(i.title)+' · '+(i.start===i.end?f(i.start):f(i.start)+' – '+f(i.end))+'</div>';
  }catch(e){return ''}
}
function renderHome(){
  var s=auth(); if(!s) return;
  var h=new Date().getHours();
  $('#hello').textContent=t(h<12?'hiMorning':h<17?'hiAfternoon':'hiEvening');
  $('#who').className='who'+(s.group==='admin'?'':' view');
  $('#whoTx').textContent=(s.groupName||[])[LANG==='en'?1:0]||'';
  $('#asGroup').textContent=(LANG==='en'?'Signed in as: ':'เข้าสู่ระบบในฐานะ: ')+((s.groupName||[])[LANG==='en'?1:0]||'');
  $('#grid').innerHTML=APPS.map(function(a){
    var ok=canOpen(a,s), L=LANG==='en'?1:0;
    var inner='<div class="ic"><svg class="i" viewBox="0 0 24 24">'+a.icon+'</svg></div>'+
      '<h2>'+esc(a.name[L])+'<small>'+esc(a.sub[L])+'</small></h2>'+
      '<p>'+esc(a.desc[L])+'</p>'+(a.id==='director'?directorPeek():'')+
      '<div class="go">'+(ok?'<span>'+t('open')+'</span><span>→</span>':'<span>🔒 '+t('locked')+'</span><span class="k">'+t('lockedHint')+'</span>')+'</div>';
    var st='style="--c:'+a.c+';--cb:'+a.cb+'"';
    return ok?'<a class="app" '+st+' href="'+esc(a.url)+'" data-app="'+a.id+'">'+inner+'</a>':'<div class="app locked" '+st+'>'+inner+'</div>';
  }).join('');
}
function showHome(){ $('#login').classList.add('hidden'); $('#home').classList.remove('hidden'); renderHome(); }

/* ---------- boot ---------- */
(function(){
  if(LOGO_SRC) $$('.logoSlot').forEach(function(e){e.innerHTML='<img alt="PMU-B" src="'+LOGO_SRC+'">'});
  $('#mini').innerHTML=APPS.map(function(a){return '<span style="background:'+a.c+'"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px">'+a.icon+'</svg></span>'}).join('');
  $('#ver').textContent=VERSION;
  $('#go').onclick=login;
  $('#code').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
  $('#out').onclick=signOut;
  $$('[data-lang]').forEach(function(g){g.onclick=function(e){var b=e.target.closest('button');if(b)setLang(b.dataset.l)}});
  $$('#login [data-lang]').forEach(function(g){g.classList.add('lt')});
  setLang(get('d3one:lang')||get('peb_lang')||'th');
  if(auth()) showHome(); else setTimeout(function(){$('#code').focus()},60);
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(function(){});
  window.addEventListener('pageshow',function(){ if(!auth()&&!$('#home').classList.contains('hidden')) location.reload(); else if(auth()) renderHome(); });
})();
</script>
